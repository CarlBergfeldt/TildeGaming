<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172234">
  <meta name="description" content="Horse Runner — a crisp, 90s-inspired pixel-art browser game.">
  <title>Horse Runner: Bramblewood Trail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="cabinet">
    <header class="brand">
      <div>
        <p class="eyebrow">Tilde Gaming presents</p>
        <h1>Horse Runner</h1>
      </div>
      <div class="brand__actions">
        <button id="sound" class="icon-button" type="button" aria-pressed="false" title="Toggle sound">♪ On</button>
        <button id="pause" class="icon-button" type="button" aria-pressed="false">Pause</button>
      </div>
    </header>

    <section class="screen-frame" aria-label="Horse Runner game">
      <div class="screen">
        <canvas id="game" width="320" height="180" tabindex="0" aria-label="Horse Runner. Press Space or tap to jump."></canvas>
        <div id="start-card" class="start-card">
          <p class="ribbon">Bramblewood Trail</p>
          <h2>Ride into the wild</h2>
          <p>Clear the woodland hurdles, gather golden apples, and chase a new trail record.</p>
          <button id="start" class="primary" type="button">Start the run</button>
          <p class="key-hint"><kbd>Space</kbd> / <kbd>↑</kbd> / tap to jump</p>
        </div>
      </div>
      <div class="screen-frame__shine" aria-hidden="true"></div>
    </section>

    <section class="dashboard" aria-label="Game information">
      <div class="stat"><span>Score</span><strong id="score">00000</strong></div>
      <div class="stat"><span>Best trail</span><strong id="best">00000</strong></div>
      <div class="stat"><span>Hearts</span><strong id="lives" aria-label="3 lives">♥ ♥ ♥</strong></div>
      <div class="controls">
        <button id="jump" class="jump-button" type="button"><span>Jump</span><small>Space · ↑ · tap</small></button>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">Ready at the trailhead.</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
